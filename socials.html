<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="styles.css">
   <link rel="icon" href="favicon.jpg" type="image/jpeg">
   <title>Socials</title>
</head>
<body class="socials-page">
   <a class="skip-link" href="#main-content">Skip to main content</a>
   <header class="hero-box">
      <h1 class="world">My socials</h1>
   </header>
   <main class="socials-content" id="main-content">
      <nav class="links socials-links" aria-label="Social links">
         <a class="basicButton social-icon-link" href="https://www.youtube.com/@Pizzalord01">
            <img class="social-link-icon" src="youtube-color-icon-small.jpg" alt="" width="96" height="96">
            My YouTube
         </a>
         <a class="basicButton social-icon-link" href="https://www.tiktok.com/@callmecircuitbackup">
            <img class="social-link-icon" src="tiktok-solo-icon-small.jpg" alt="" width="96" height="96">
            My TikTok
         </a>
         <a class="basicButton social-icon-link" href="https://www.instagram.com/deadmemories4lif/">
            <img class="social-link-icon" src="ig-instagram-icon-small.jpg" alt="" width="96" height="96">
            My Instagram
         </a>
         <a class="basicButton social-icon-link" href="https://www.twitch.tv/pizzasgrave">
            <img class="social-link-icon" src="twitch-color-icon-small.jpg" alt="" width="96" height="96">
            My Twitch
         </a>
          <a class="basicButton social-icon-link" href="https://www.reddit.com/user/Impressive_Taro_1483/">
            <img class="social-link-icon" src="reddit-square-color-icon-small.jpg" alt="" width="96" height="96">
            My Reddit
         </a>
         <section class="discord-status">
  <h2>Discord Status</h2>
  <div class="discord-status-trigger-wrap">
    <iframe
      class="discord-status-iframe"
      src="https://status.pizzalord.online/"
      title="Discord status"
      width="100%"
      height="80"
      loading="lazy"
      scrolling="no"
      frameborder="0">
    </iframe>
    <button class="discord-status-trigger" type="button" aria-label="Show Discord contact details" aria-haspopup="dialog" aria-controls="discordContactDialog" aria-expanded="false"></button>
    <span class="discord-status-tooltip" id="discordStatusTooltip" aria-hidden="true" hidden>click to add me on Discord</span>
  </div>
</section>


         <a class="basicButton" href="index.html" style="width: fit-content;">Back</a>
      </nav>
      <p class="world socials-note">Will add more later....</p>
   </main>
   <dialog class="discord-contact-dialog" id="discordContactDialog" aria-labelledby="discordContactTitle">
      <button class="basicButton discord-contact-back" type="button">Close</button>
      <h2 id="discordContactTitle">add me on discord:</h2>
      <div class="discord-contact-copy-row">
         <input id="discordUsername" type="text" value="pizzasgrave" readonly aria-label="Discord username">
         <button class="basicButton" id="copyDiscordUsername" type="button" aria-label="Copy Discord username">copy</button>
      </div>
      <p class="discord-contact-copy-status" id="discordCopyStatus" role="status" aria-live="polite" aria-atomic="true"></p>
   </dialog>
   <script src="socials.js"></script>
   <script src="surprise.js?v=5"></script>
</body>
</html>
