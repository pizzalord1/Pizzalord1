<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
   <div class="hero-box">
       <div class="website-carousel" role="region" aria-roledescription="carousel" aria-label="Cat photos">
           <input class="carousel-slide-toggle" type="radio" name="cat-photo-slide" id="catPhotoSlide1" aria-label="Slide 1 of 4" checked>
           <input class="carousel-slide-toggle" type="radio" name="cat-photo-slide" id="catPhotoSlide2" aria-label="Slide 2 of 4">
           <input class="carousel-slide-toggle" type="radio" name="cat-photo-slide" id="catPhotoSlide3" aria-label="Slide 3 of 4">
           <input class="carousel-slide-toggle" type="radio" name="cat-photo-slide" id="catPhotoSlide4" aria-label="Slide 4 of 4">
           <div class="carousel-indicators">
               <label for="catPhotoSlide1" aria-label="Show slide 1"></label>
               <label for="catPhotoSlide2" aria-label="Show slide 2"></label>
               <label for="catPhotoSlide3" aria-label="Show slide 3"></label>
               <label for="catPhotoSlide4" aria-label="Show slide 4"></label>
           </div>
           <div class="carousel-inner">
               <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="1 of 4">
                   <button class="photo-trigger" type="button" data-description="Taken in March 2026 on a iPhone 16 Pro.">
                       <picture>
                           <source srcset="IMG_4303.jxl" type="image/jxl">
                           <img class="website-photo" src="IMG_4303.JPG" alt="Omlette" width="463" height="824" loading="eager" fetchpriority="high" decoding="async" data-download="IMG_4303.JPG">
                       </picture>
                   </button>
               </div>
               <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 4">
                   <button class="photo-trigger" type="button" data-description="Taken in July 2026 on an iPhone 16 Pro.">
                       <picture>
                           <source data-srcset="IMG_6398.jxl" type="image/jxl">
                           <img class="website-photo" data-src="IMG_6398.JPG" alt="Junior" width="1465" height="824" loading="lazy" decoding="async" data-download="IMG_6398.JPG">
                       </picture>
                   </button>
               </div>
               <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 4">
                   <button class="photo-trigger" type="button" data-description="Photo taken in October 2026 on a Canon PowerShot SX110 IS.">
                       <picture>
                           <img class="website-photo" data-src="IMG_2094-optimized.JPG" alt="Nigel" width="1800" height="1350" loading="lazy" decoding="async" data-download="IMG_2094.JPG">
                       </picture>
                   </button>
               </div>
               <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="4 of 4">
                   <button class="photo-trigger" type="button" data-description="Photo taken in June 2026 on an iPhone 16 Pro.">
                       <picture>
                           <source data-srcset="IMG_5774.jxl" type="image/jxl">
                           <img class="website-photo" data-src="IMG_5774.JPG" alt="Harley" width="377" height="212" loading="lazy" decoding="async" data-download="IMG_5774.JPG">
                       </picture>
                   </button>
               </div>
           </div>
           <div class="carousel-controls" aria-hidden="true">
               <label class="carousel-control-prev prev-slide-4" for="catPhotoSlide4"></label>
               <label class="carousel-control-prev prev-slide-1" for="catPhotoSlide1"></label>
               <label class="carousel-control-prev prev-slide-2" for="catPhotoSlide2"></label>
               <label class="carousel-control-prev prev-slide-3" for="catPhotoSlide3"></label>
               <label class="carousel-control-next next-slide-2" for="catPhotoSlide2"></label>
               <label class="carousel-control-next next-slide-3" for="catPhotoSlide3"></label>
               <label class="carousel-control-next next-slide-4" for="catPhotoSlide4"></label>
               <label class="carousel-control-next next-slide-1" for="catPhotoSlide1"></label>
           </div>
       </div>
       <h1 class="world">Welcome to Pizzalord.online</h1>
   </div>
  
   <div class="links home-links">
       <a class="basicButton" href="Minecraft Worlds.html" >Download my Minecraft World</a>
   <a class="basicButton" href="linkshrub.html" >Link.shrub /!\ under construction /!\</a>
    <a class="basicButton" href="access-denied.html" style="color: rgb(117, 0, 0);">Access Denied</a>
       <a class="basicButton" href="socials.html" >My socials</a>
       <a class="basicButton" href="oldprocessinglinks.html" >Old processing projects</a>
   </div>

    <footer class="site-footer" style="color: black;">
        <div class="site-footer-content">
            <div class="site-footer-links">
                <div class="site-footer-link">
                    <a class="basicButton" href="AboutMe.html">About me</a>
                </div>
                <div class="site-footer-link">
                    <a class="basicButton" href="https://github.com/pizzalord1/Pizzalord1">View my code</a>

                </div>
            </div>
            <p class="site-footer-credit"><b>2026 by Xavier</b></p>
        </div>
   </footer>
    <dialog class="photo-description-dialog" id="photoDescriptionDialog" aria-labelledby="photoDescription">
        <div class="photo-description-content">
            <form method="dialog">
                <button class="basicButton photo-description-close" type="submit">Close</button>
            </form>
            <img class="photo-description-image" id="photoDescriptionImage" alt="">
            <p id="photoDescription"></p>
            <p class="photo-description-secondary" id="photoAdditionalDescription" hidden></p>
            <div class="photo-description-actions">
                <a class="basicButton" id="photoDownloadLink" download>Download photo</a>
            </div>
        </div>
    </dialog>
    <script src="photo-description.js"></script>

   
</body>
</html>
