# wrangler.toml
name = 'pizzalord1'
main = "cloudflare/contact-worker.js"
compatibility_date = "2026-11-10"
workers_dev = true
preview_urls = false

routes = [
    { pattern = "pizzalord.online/api/contact*", zone_name = "pizzalord.online" }
]

[vars]
SENDER_EMAIL = "contact@pizzalord.online"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[[send_email]]
name = "EMAIL"
remote = true
