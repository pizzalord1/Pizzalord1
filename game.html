<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>

</head>
<body>
    <style>
        #choices-container {
        display: inline-block;
        color: #249c00;
        background-color: #3c573c;
        border: 1px solid #249c00;
        border-radius: 8px;
        padding: 16px;
        min-width: 200px;
        box-shadow: 0 0 10px rgba(36, 156, 0, 0.25);
    }

    #choices-container button {
        color: #ffffff;
        background-color: #203820;
        border: 1px solid #249c00;
        border-radius: 4px;
        padding: 8px 12px;
        margin: 4px;
        cursor: pointer;
    }

    #choices-container button:hover {
        background-color: #315b31;
    }
    body {
        background-color: rgb(0, 0, 0);
        color: rgb(255, 255, 255);
    }

    #scene-image {
        display: block;
        max-width: 100%;
        height: auto;
        margin-top: 12px;
    }

    #scene-image[hidden] {
        display: none;
    }

    a {
        text-decoration: none;
    }
    </style>

    <header>
      <nav>
            <ul> 
                <li><a href="capstoneprojects.html" style="color: rgb(247, 250, 246); border: 3px solid rgb(189, 255, 113); background-color: rgb(91, 194, 32);  border-left: 3px solid rgb(16, 70, 0); border-bottom: 3px solid rgb(16, 70, 0);">back</a></li>
            </ul>
            <ul> 
            </ul>
            <ul> 
                <li><a href="game.html" style="color: rgb(255, 255, 255); border: 3px solid rgb(189, 255, 113); background-color: rgb(91, 194, 32);  border-left: 3px solid rgb(16, 70, 0); border-bottom: 3px solid rgb(16, 70, 0);">restart</a></li>
            </ul>
        </nav>
        <img id="scene-image" src="Microslop.jpg" alt="Micro Center store" hidden>
    </header>

    <main>
    <header>
        <h1 id="scene-title" style="color: rgb(36, 156, 0);">  </h1>
        <h2 id="character-name" style="color: rgb(36, 156, 0);">  </h2>
    </header>
    
    <section>
    <p id="scene-text" style="color: rgb(36, 156, 0);">     </p>

    </section>

    <section>
        <div id="choices-container"> </div>
    </section>   
        
    <section>
        <p> Current HP:</p>
        <ul>
            <li id="health-display"> 100</li>
        </ul>

        <p> Inventory:</p>
        <ul>
            <li id="inventory-display"> </li>
        </ul>

        <p id="message-display"></p>
    </section>


    </main>
    <footer>

    </footer>
</body>
</html>
